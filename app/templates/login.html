{% extends "base.html" %}
{% block title %}Sign In — SkyWay Travel{% endblock %}
{% block content %}
<div class="form-card">
  <h2 style="margin-bottom:0.5rem;">Sign In to SkyWay Travel</h2>
  <p style="color:#64748b;font-size:0.9rem;margin-bottom:1.5rem;">Access your itineraries, boarding passes, and loyalty rewards.</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form action="/login" method="POST">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="e.g. alice" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
  </form>

  <p style="margin-top:1.25rem;font-size:0.9rem;text-align:center;color:#64748b;">
    Don't have an account? <a href="/register">Create one now</a>
  </p>
</div>
{% endblock %}
